name: Release

# Wydanie leci automatycznie po merge PR-a develop -> master, ktory zmienia
# VERSION.md. Numer wersji pochodzi z VERSION.md (package.json tylko go
# powtarza - zgodnosc sprawdza `npm run version:check`). Jesli tag v<wersja>
# juz istnieje, workflow konczy sie bez publikacji - dzieki temu zmiana w
# VERSION.md bez podbicia numeru niczego nie nadpisuje ani nie wywala buildu.
on:
  push:
    branches: [master]
    # Filtr na plik wersji: guard (`node tools/version.js`) czyta numer wylacznie
    # z VERSION.md, wiec push na `master`, ktory tego pliku nie rusza, i tak nie
    # moglby niczego wydac - a bez filtra kazdy merge (dokumentacja, zaleznosci,
    # poprawki) uruchamial runner tylko po to, zeby guard stwierdzil "nic do
    # wydania". Konto ma wyczerpany limit minut, a kazdy job to minimum 1 minuta.
    #
    # Konsekwencje:
    # - push/merge bez zmiany VERSION.md nie startuje NICZEGO (brak przebiegu),
    # - package.json celowo NIE jest na liscie: zmiana zaleznosci to nie wydanie,
    #   a rozjazd numerow z VERSION.md lapie CI na PR-ze (`version:check`),
    # - plik tego workflowa tez NIE jest na liscie - zmiany w nim wchodza w zycie
    #   przy najblizszym wydaniu (podbiciu VERSION.md). Reczny Run workflow bez
    #   `force` przy istniejacym tagu wykonuje tylko guard i niczego wiecej nie
    #   sprawdza; `force` publikuje naprawde,
    # - ponowienie wydania (np. po poprawce na `master` bez podbicia numeru, albo
    #   gdy publikacja padla) -> Actions -> Release -> Run workflow; z opcja
    #   `force`, jesli tag v<wersja> juz istnieje.
    paths:
      - 'VERSION.md'
  workflow_dispatch:
    inputs:
      force:
        description: 'Wydaj nawet jesli tag juz istnieje (nadpisze release)'
        type: boolean
        default: false

# `actions: write` - tylko do skasowania artefaktu-transportu na koncu joba
# `release` (patrz krok "Usun artefakty tego przebiegu"). Job `build` ma
# wlasny blok `permissions:`, ktory ten zastepuje w calosci.
permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Czy jest co wydawac
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Rozjazd VERSION.md <-> package.json zatrzymuje wydanie od razu, zanim
      # cokolwiek sie zbuduje - inaczej artefakty mialyby zla nazwe.
      - name: Zgodnosc VERSION.md i package.json
        run: node tools/version.js --check

      - id: check
        shell: bash
        run: |
          VERSION=$(node tools/version.js)
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.force }}" = "true" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Wymuszone wydanie ${TAG}"
          elif git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag ${TAG} juz istnieje - pomijam wydanie. Podbij numer w VERSION.md."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Wydaje ${TAG}"
          fi

  # Testow nie ma tu osobno: dokladnie to samo drzewo przechodzi pelny zestaw
  # w ci.yml na PR-ze `develop` -> `master` tuz przed merge'em, a powtorka
  # kosztowala ~16-24 platne minuty na Windowsie przy kazdym wydaniu.
  # Wydanie z galezi, ktora nie przeszla przez taki PR, nie jest testowane -
  # przyjeta swiadomie razem z reszta ciecia minut.
  build:
    name: Build ${{ matrix.name }}
    needs: guard
    if: needs.guard.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Potrzebne do wystawienia poswiadczenia pochodzenia (build provenance):
    # kryptograficznego dowodu, ze dany plik powstal z tego commita w tym repo.
    # Nie zastepuje podpisu kodu, ale pozwala zweryfikowac plik przez `gh attestation verify`.
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      # `fail-fast: false` nic tu nie robi, bo aktywny jest jeden wpis matrycy.
      # Przywroc je razem z kolejna platforma.
      matrix:
        # Zeby dolozyc kolejna platforme, wystarczy dopisac wpis tutaj -
        # electron-builder.yml ma juz gotowe sekcje `linux` i `mac`.
        include:
          - os: windows-latest
            name: windows
            builder: --win
            artifacts: |
              dist/*.exe
              dist/*.zip
          # - os: ubuntu-latest
          #   name: linux
          #   builder: --linux
          #   artifacts: |
          #     dist/*.AppImage
          #     dist/*.deb
          # - os: macos-latest
          #   name: macos
          #   builder: --mac
          #   artifacts: |
          #     dist/*.dmg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run icon

      - name: electron-builder
        run: npx electron-builder ${{ matrix.builder }} --publish never
        env:
          # Bez certyfikatu - nie probuj szukac go w systemie.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # GitHub nie pozwala zapisywac poswiadczen w prywatnych repozytoriach nalezacych
      # do konta uzytkownika ("Feature not available for user-owned private repositories").
      # Krok wlaczy sie sam, gdy repozytorium stanie sie publiczne.
      - name: Poswiadczenie pochodzenia buildu
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.artifacts }}

      # To nie jest raport, tylko jedyny sposob, w jaki wynik buildu z Windowsa
      # dociera do joba `release` (download-artifact) - bez tego kroku nie ma
      # z czego zlozyc wydania. Plik jest odbierany kilka minut pozniej w tym
      # samym przebiegu, wiec retencja schodzi do minimum: 1 dzien zamiast 7.
      # Po udanej publikacji job `release` kasuje go od razu (krok "Usun
      # artefakty tego przebiegu"), wiec pelna dobe lezy tylko po porazce.
      #
      # Konsekwencja krotkiej retencji: jesli padnie job `release`, przycisk
      # "Re-run failed jobs" pomoze wylacznie tego samego dnia. Pozniej artefakt
      # juz wygasl, download-artifact nie ma czego pobrac i trzeba powtorzyc caly
      # przebieg razem z platnym, ~30-minutowym buildem na Windowsie.
      # Opisane w docs/RELEASING.md.
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publikacja GitHub Release
    needs: [guard, build]
    if: needs.guard.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Lista artefaktow
        run: ls -la artifacts

      - name: Tresc wydania z CHANGELOG.md
        shell: bash
        run: |
          node tools/changelog-section.js "${{ needs.guard.outputs.version }}" > RELEASE_NOTES.md
          {
            echo ""
            echo "## Which file to download"
            echo ""
            echo "| file | for whom |"
            echo "|---|---|"
            echo "| \`...-setup.exe\` | installer: shortcuts on the desktop and in the Start menu |"
            echo "| \`...-portable.exe\` | a single file, no installation |"
            echo "| \`...-win-x64.zip\` | the same as portable, in an archive, when your browser blocks \`.exe\` downloads |"
            echo ""
            echo "The files are not signed with a publisher certificate, so Windows will show"
            echo "\"Windows protected your PC\", meaning **More info -> Run anyway**."
            echo "Instead of taking that on faith, you can check what you downloaded:"
            echo ""
            echo "**Checksum** (PowerShell):"
            echo ""
            echo '```powershell'
            echo 'Get-FileHash .\file-name.exe -Algorithm SHA256'
            echo '```'
            echo ""
            # Poswiadczenia powstaja tylko dla repozytoriow publicznych, patrz job `build`.
            if [ "${{ github.event.repository.private }}" = "false" ]; then
              echo "**Build provenance**, proof that the file was built from this commit by GitHub Actions:"
              echo ""
              echo '```bash'
              echo "gh attestation verify file-name.exe --repo ${{ github.repository }}"
              echo '```'
              echo ""
            fi
            echo "### SHA-256"
            echo ""
            echo '```'
            ( cd artifacts && sha256sum * | sort -k2 )
            echo '```'
            echo ""
            echo "---"
            echo ""
            echo "An unofficial fan project, not affiliated with or endorsed by CipSoft GmbH."
            echo "The replacement covers sound files only: it does not change gameplay and gives"
            echo "no advantage over other players. The Tibia client is supported only in its"
            echo "original state, so modifying its files is done at your own risk."
            echo ""
            echo "The application interface is in Polish; the documentation is in English."
          } >> RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Tag i release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.guard.outputs.tag }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push -f origin "$TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file RELEASE_NOTES.md \
            artifacts/*

      # Instalatory sa juz w GitHub Release (job `site` pobiera je stamtad, nie
      # z artefaktu), wiec artefakt-transport tylko zajmowalby Actions storage.
      # `success()`: gdy publikacja padnie, artefakt zostaje na dobe dla
      # "Re-run failed jobs". `continue-on-error`: nieudane sprzatanie nigdy nie
      # moze wywrocic wydania - artefakt i tak wygasnie po 1 dniu.
      # Wymaga `actions: write` (blok `permissions:` na gorze pliku).
      # `shell: bash` wlacza `-o pipefail`: bez niego nieudane listowanie
      # artefaktow konczy sie cichym sukcesem `xargs -r` zamiast ostrzezenia.
      - name: Usun artefakty tego przebiegu
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[].id' \
            | xargs -r -I{} gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/{}"

  # Kopia wydania do repozytorium serwisu (https://mysttic.github.io/Mysttic/).
  # Leza tam wydania kilku projektow, po jednym, najnowszym z kazdego, i stamtad
  # pyta o wersje aktualizator w aplikacji. Pelna historia zostaje w tym repo.
  #
  # Kolejnosc jest istotna: nowe wydanie powstaje, zanim znikna stare, wiec strona
  # nie jest pusta nawet przez chwile.
  site:
    name: Kopia na strone
    needs: [guard, release]
    if: needs.guard.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUB: Mysttic/Mysttic
      PROJECT: tibia-sounds-config
      NAME: Tibia Sounds Config
      SITE: https://mysttic.github.io/Mysttic/tibia-sounds-config/
      VERSION: ${{ needs.guard.outputs.version }}
      TAG: ${{ needs.guard.outputs.tag }}
      HUB_TAG: tibia-sounds-config-v${{ needs.guard.outputs.version }}
    steps:
      # Domyslny GITHUB_TOKEN siega tylko do tego repozytorium, wiec kopia wymaga
      # osobnego tokenu. Ma date waznosci: gdy wygasnie, ten job pada z czytelnym
      # bledem, a wydanie w tym repo zostaje na miejscu.
      - name: Poswiadczenie do repozytorium serwisu
        env:
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${HUB_TOKEN:-}" ]; then
            echo "::error::Brak sekretu HUB_TOKEN. Wydanie $TAG powstalo, kopia na strone nie."
            echo "::error::Potrzebny token osobisty z Contents: read and write na $HUB."
            exit 1
          fi

      - name: Pliki z wydania
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p copy
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --dir copy --pattern "$PROJECT-*"
          ls -la copy
          if [ "$(ls -1 copy | wc -l)" -ne 3 ]; then
            echo "::error::Spodziewam sie trzech plikow w wydaniu $TAG (setup, portable, zip)."
            exit 1
          fi

      # Opis wydania na hubie to numer i adres strony. Pelny opis zmian zostaje
      # w tym repozytorium, bo notatki z huba widzi tez karta aktualizacji.
      - name: Opis wydania
        run: |
          set -euo pipefail
          {
            echo "$NAME $VERSION"
            echo
            echo "$SITE"
          } > notes.md
          cat notes.md

      - name: Wydanie na stronie
        env:
          GH_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$HUB_TAG" --repo "$HUB" >/dev/null 2>&1; then
            gh release delete "$HUB_TAG" --repo "$HUB" --cleanup-tag --yes
          fi
          gh release create "$HUB_TAG" copy/* \
            --repo "$HUB" \
            --title "$NAME $VERSION" \
            --notes-file notes.md \
            --target master

      # Filtr `^$PROJECT-v` pilnuje, zeby kasowanie nie tknelo wydan innych projektow.
      - name: Na stronie zostaje jedna wersja
        env:
          GH_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release list --repo "$HUB" --limit 100 --json tagName -q '.[].tagName' \
            | { grep -E "^$PROJECT-v" || true; } \
            | { grep -vxF "$HUB_TAG" || true; } \
            | while read -r old; do
                echo "Kasuje $old"
                gh release delete "$old" --repo "$HUB" --cleanup-tag --yes
              done
          echo "$HUB_TAG zostaje na stronie" >> "$GITHUB_STEP_SUMMARY"
