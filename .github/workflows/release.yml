name: Release

# Wydanie leci automatycznie po merge PR-a develop -> master.
# Numer wersji pochodzi z VERSION.md (package.json tylko go powtarza - zgodnosc
# sprawdza `npm run version:check`). Jesli tag v<wersja> juz istnieje, workflow
# konczy sie bez publikacji - dzieki temu merge bez podbicia wersji (np. poprawka
# dokumentacji) niczego nie nadpisuje ani nie wywala buildu.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      force:
        description: 'Wydaj nawet jesli tag juz istnieje (nadpisze release)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Czy jest co wydawac
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Rozjazd VERSION.md <-> package.json zatrzymuje wydanie od razu, zanim
      # cokolwiek sie zbuduje - inaczej artefakty mialyby zla nazwe.
      - name: Zgodnosc VERSION.md i package.json
        run: node tools/version.js --check

      - id: check
        shell: bash
        run: |
          VERSION=$(node tools/version.js)
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.force }}" = "true" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Wymuszone wydanie ${TAG}"
          elif git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag ${TAG} juz istnieje - pomijam wydanie. Podbij numer w VERSION.md."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Wydaje ${TAG}"
          fi

  test:
    name: Testy przed wydaniem
    needs: guard
    if: needs.guard.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: choco install ffmpeg --no-progress -y
      - run: npm ci
      - run: npm run icon
      - run: npm test

  build:
    name: Build ${{ matrix.name }}
    needs: [guard, test]
    if: needs.guard.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    # Potrzebne do wystawienia poswiadczenia pochodzenia (build provenance):
    # kryptograficznego dowodu, ze dany plik powstal z tego commita w tym repo.
    # Nie zastepuje podpisu kodu, ale pozwala zweryfikowac plik przez `gh attestation verify`.
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        # Zeby dolozyc kolejna platforme, wystarczy dopisac wpis tutaj -
        # electron-builder.yml ma juz gotowe sekcje `linux` i `mac`.
        include:
          - os: windows-latest
            name: windows
            builder: --win
            artifacts: |
              dist/*.exe
              dist/*.zip
          # - os: ubuntu-latest
          #   name: linux
          #   builder: --linux
          #   artifacts: |
          #     dist/*.AppImage
          #     dist/*.deb
          # - os: macos-latest
          #   name: macos
          #   builder: --mac
          #   artifacts: |
          #     dist/*.dmg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run icon

      - name: electron-builder
        run: npx electron-builder ${{ matrix.builder }} --publish never
        env:
          # Bez certyfikatu - nie probuj szukac go w systemie.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # GitHub nie pozwala zapisywac poswiadczen w prywatnych repozytoriach nalezacych
      # do konta uzytkownika ("Feature not available for user-owned private repositories").
      # Krok wlaczy sie sam, gdy repozytorium stanie sie publiczne.
      - name: Poswiadczenie pochodzenia buildu
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.artifacts }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publikacja GitHub Release
    needs: [guard, build]
    if: needs.guard.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Lista artefaktow
        run: ls -la artifacts

      - name: Tresc wydania z CHANGELOG.md
        shell: bash
        run: |
          node tools/changelog-section.js "${{ needs.guard.outputs.version }}" > RELEASE_NOTES.md
          {
            echo ""
            echo "## Which file to download"
            echo ""
            echo "| file | for whom |"
            echo "|---|---|"
            echo "| \`...-setup.exe\` | installer: shortcuts on the desktop and in the Start menu |"
            echo "| \`...-portable.exe\` | a single file, no installation |"
            echo "| \`...-win-x64.zip\` | the same as portable, in an archive, when your browser blocks \`.exe\` downloads |"
            echo ""
            echo "The files are not signed with a publisher certificate, so Windows will show"
            echo "\"Windows protected your PC\", meaning **More info -> Run anyway**."
            echo "Instead of taking that on faith, you can check what you downloaded:"
            echo ""
            echo "**Checksum** (PowerShell):"
            echo ""
            echo '```powershell'
            echo 'Get-FileHash .\file-name.exe -Algorithm SHA256'
            echo '```'
            echo ""
            # Poswiadczenia powstaja tylko dla repozytoriow publicznych, patrz job `build`.
            if [ "${{ github.event.repository.private }}" = "false" ]; then
              echo "**Build provenance**, proof that the file was built from this commit by GitHub Actions:"
              echo ""
              echo '```bash'
              echo "gh attestation verify file-name.exe --repo ${{ github.repository }}"
              echo '```'
              echo ""
            fi
            echo "### SHA-256"
            echo ""
            echo '```'
            ( cd artifacts && sha256sum * | sort -k2 )
            echo '```'
            echo ""
            echo "---"
            echo ""
            echo "An unofficial fan project, not affiliated with or endorsed by CipSoft GmbH."
            echo "The replacement covers sound files only: it does not change gameplay and gives"
            echo "no advantage over other players. The Tibia client is supported only in its"
            echo "original state, so modifying its files is done at your own risk."
            echo ""
            echo "The application interface is in Polish; the documentation is in English."
          } >> RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Tag i release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.guard.outputs.tag }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push -f origin "$TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file RELEASE_NOTES.md \
            artifacts/*

  # Kopia wydania do repozytorium serwisu (https://mysttic.github.io/Mysttic/).
  # Leza tam wydania kilku projektow, po jednym, najnowszym z kazdego, i stamtad
  # pyta o wersje aktualizator w aplikacji. Pelna historia zostaje w tym repo.
  #
  # Kolejnosc jest istotna: nowe wydanie powstaje, zanim znikna stare, wiec strona
  # nie jest pusta nawet przez chwile.
  site:
    name: Kopia na strone
    needs: [guard, release]
    if: needs.guard.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      HUB: Mysttic/Mysttic
      PROJECT: tibia-sounds-config
      NAME: Tibia Sounds Config
      SITE: https://mysttic.github.io/Mysttic/tibia-sounds-config/
      VERSION: ${{ needs.guard.outputs.version }}
      TAG: ${{ needs.guard.outputs.tag }}
      HUB_TAG: tibia-sounds-config-v${{ needs.guard.outputs.version }}
    steps:
      # Domyslny GITHUB_TOKEN siega tylko do tego repozytorium, wiec kopia wymaga
      # osobnego tokenu. Ma date waznosci: gdy wygasnie, ten job pada z czytelnym
      # bledem, a wydanie w tym repo zostaje na miejscu.
      - name: Poswiadczenie do repozytorium serwisu
        env:
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${HUB_TOKEN:-}" ]; then
            echo "::error::Brak sekretu HUB_TOKEN. Wydanie $TAG powstalo, kopia na strone nie."
            echo "::error::Potrzebny token osobisty z Contents: read and write na $HUB."
            exit 1
          fi

      - name: Pliki z wydania
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p copy
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --dir copy --pattern "$PROJECT-*"
          ls -la copy
          if [ "$(ls -1 copy | wc -l)" -ne 3 ]; then
            echo "::error::Spodziewam sie trzech plikow w wydaniu $TAG (setup, portable, zip)."
            exit 1
          fi

      # Opis wydania na hubie to numer i adres strony. Pelny opis zmian zostaje
      # w tym repozytorium, bo notatki z huba widzi tez karta aktualizacji.
      - name: Opis wydania
        run: |
          set -euo pipefail
          {
            echo "$NAME $VERSION"
            echo
            echo "$SITE"
          } > notes.md
          cat notes.md

      - name: Wydanie na stronie
        env:
          GH_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$HUB_TAG" --repo "$HUB" >/dev/null 2>&1; then
            gh release delete "$HUB_TAG" --repo "$HUB" --cleanup-tag --yes
          fi
          gh release create "$HUB_TAG" copy/* \
            --repo "$HUB" \
            --title "$NAME $VERSION" \
            --notes-file notes.md \
            --target master

      # Filtr `^$PROJECT-v` pilnuje, zeby kasowanie nie tknelo wydan innych projektow.
      - name: Na stronie zostaje jedna wersja
        env:
          GH_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release list --repo "$HUB" --limit 100 --json tagName -q '.[].tagName' \
            | { grep -E "^$PROJECT-v" || true; } \
            | { grep -vxF "$HUB_TAG" || true; } \
            | while read -r old; do
                echo "Kasuje $old"
                gh release delete "$old" --repo "$HUB" --cleanup-tag --yes
              done
          echo "$HUB_TAG zostaje na stronie" >> "$GITHUB_STEP_SUMMARY"
