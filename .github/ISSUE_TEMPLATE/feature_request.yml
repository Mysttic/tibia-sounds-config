name: Feature request
description: An idea for a new feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or inconvenient. Describe the situation rather than jumping to a solution.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: scope
    attributes:
      label: What it concerns
      options:
        - label: reading the sound bank / action names
        - label: the interface (table, filters, playback)
        - label: replacement / audio conversion
        - label: profile, vault, backups of originals
        - label: build and releases
