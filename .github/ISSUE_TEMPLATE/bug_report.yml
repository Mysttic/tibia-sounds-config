name: Bug
description: Something does not work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before reporting: check the top bar in the app (client version, name source, ffmpeg status)
        and the footer (error message). That information is the most useful.

        The application interface is in Polish, so quoting the Polish labels you saw is fine.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did and what you saw instead of the expected result.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps
      placeholder: |
        1. I selected the client in ...
        2. I clicked "Podmien" on sound #677
        3. ...
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: "1.7.0"
    validations:
      required: true

  - type: input
    id: client-version
    attributes:
      label: Tibia client version
      description: Visible in the top bar, for example "15.32.df7b29"
    validations:
      required: true

  - type: dropdown
    id: enums
    attributes:
      label: Source of the action names
      options:
        - names from client.exe
        - names from the snapshot
        - not sure
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error message
      description: The text from the app footer or from the console.
      render: text

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 26200"
